[project]
name = "bindu-clinic-api"
version = "0.1.0"
description = "Bindu Clinic API"
requires-python = ">=3.11"
# Vercel installs from this list (it prefers pyproject.toml over requirements.txt).
# Keep it identical to requirements.txt; tests/unit/test_dependencies.py enforces that.
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4",
    "tzdata>=2024.1",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "cryptography>=43",
    "argon2-cffi>=23.1",
    "PyJWT>=2.8",
    "httpx>=0.27",
    "langchain-xai>=1.3",
    "langchain-openai>=1.8",
    "langchain-core>=1.8",
    "pinecone>=5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S101", "E501"]
"app/database/migrations/versions/*" = ["E501"]
