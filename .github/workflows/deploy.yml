name: Deploy

# Runs after CI succeeds on main (or manually). Order: migrate the database, deploy the API,
# deploy the web app, then smoke-test. Migrations must be backward compatible (expand/contract),
# because the previous API version keeps serving traffic while the migration runs.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false # never interrupt a migration half way

jobs:
  migrate:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production # configure required reviewers on this environment for a manual approval gate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: backend
      - name: Apply database migrations (direct, non-pooled Neon connection)
        working-directory: backend
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: |
          test -n "$MIGRATION_DATABASE_URL" || { echo "DATABASE_URL_UNPOOLED secret is not set"; exit 1; }
          alembic current
          alembic upgrade head
          alembic current

  deploy-api:
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy the API (built on Vercel)
        working-directory: backend
        run: npx --yes vercel@latest deploy --prod --yes --token "${{ secrets.VERCEL_TOKEN }}"

  deploy-web:
    needs: deploy-api
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WEB_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy the web app (built on Vercel)
        working-directory: frontend
        run: npx --yes vercel@latest deploy --prod --yes --token "${{ secrets.VERCEL_TOKEN }}"

  smoke:
    needs: deploy-web
    runs-on: ubuntu-latest
    steps:
      - name: Check the deployed API and site
        env:
          API_URL: ${{ vars.API_URL }}
          WEB_URL: ${{ vars.WEB_URL }}
        run: |
          test -n "$API_URL" && test -n "$WEB_URL" || { echo "Set the API_URL and WEB_URL repository variables"; exit 1; }
          for i in 1 2 3 4 5 6; do
            body=$(curl -fsS --max-time 20 "$API_URL/health/ready" || true)
            echo "$body"
            echo "$body" | grep -q '"database":"ok"' && break
            [ "$i" = 6 ] && { echo "API is not ready"; exit 1; }
            sleep 10
          done
          curl -fsS --max-time 20 -o /dev/null "$WEB_URL/doctors"
